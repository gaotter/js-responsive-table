<app-sem-table>
  <app-sem-thead>
    <app-sem-td>Title</app-sem-td>
    <app-sem-td>Bekrivelse</app-sem-td>
    <app-sem-td>Salgs pris</app-sem-td>
    <app-sem-td>Status</app-sem-td>
  </app-sem-thead>
  <app-sem-tr>
    @for(data of testData; track data) {
      <app-sem-td>{{ data.title }}</app-sem-td>
      <app-sem-td>{{ data.description }}</app-sem-td>
      <app-sem-td>{{ data.amount }}</app-sem-td>
      <app-sem-td>{{ data.status }}</app-sem-td>
    }
  </app-sem-tr>
</app-sem-table>
